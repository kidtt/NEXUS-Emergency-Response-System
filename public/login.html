<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NEXUS Emergency System</title>

    <link rel="stylesheet" href="css/public.css">
    <link rel="stylesheet" href="css/portal.css">
</head>

<body class="auth-page inner-page">

    <header class="site-header" id="siteHeader">
        <div class="container nav-shell">

            <a href="public.html" class="brand" aria-label="NEXUS home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M16 3.5 27 9.8v12.4L16 28.5 5 22.2V9.8L16 3.5Z" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M16 10v12M11 13.5 21 18.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="brand-copy">
                    <strong>NEXUS</strong>
                    <small>Emergency Response Network</small>
                </span>
            </a>

            <nav class="public-nav" id="primaryNav" aria-label="Primary navigation">
                <a href="public.html">Home</a>
                <a href="report.html">Report Emergency</a>
                <a href="status.html">Track Incident</a>
                <a href="map.html">Emergency Map</a>

                <div id="authNav">
                    <a href="register.html" id="registerNav">Register</a>
                    <a href="login.html" class="nav-login active" id="loginNav">Login</a>

                    <button id="profileNav" type="button" style="display: none;">
                        <span class="nav-profile-dot" aria-hidden="true"></span>
                        <span id="profileName"></span>
                    </button>

                    <button id="logoutNav" type="button" style="display: none;">
                        Logout
                    </button>
                </div>
            </nav>

            <div class="nav-actions">
                <button class="nav-emergency" type="button" onclick="openReport()">
                    <span class="emergency-pulse" aria-hidden="true"></span>
                    Report Emergency
                </button>

                <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>

        </div>
    </header>


    <main>
        <div class="container">
            <div class="form-section">

                <div class="register-header">
                    <div class="register-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 3.5 20 7v5c0 4.5-3.4 8.2-8 8.5-4.6-.3-8-4-8-8.5V7l8-3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                            <path d="M12 8.5v4M12 15.4v.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                        </svg>
                    </div>

                    <h1 class="form-title">Login to NEXUS</h1>
                    <p class="auth-subtitle">Access your emergency reports and live incident tracking.</p>
                </div>

                <form id="loginForm" novalidate>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <label class="remember-row" for="rememberMe">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me on this device</span>
                    </label>

                    <div id="loginMessage" class="register-message" role="status" aria-live="polite"></div>

                    <div class="form-buttons">
                        <button type="submit" id="loginButton" class="btn-submit">Sign In</button>
                    </div>

                </form>

                <p class="auth-footer">
                    Don't have an account? <a href="register.html">Create one</a>
                </p>

            </div>
        </div>
    </main>


    <footer class="public-footer">
        <div class="container">
            <div class="footer-bottom">
                <span>© 2026 NEXUS Emergency Response Network</span>
                <span>Designed for faster emergency response.</span>
            </div>
        </div>
    </footer>


    <script src="js/public.js"></script>

</body>

</html>
